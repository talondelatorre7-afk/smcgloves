<section id="footer-1390">
    <style>
        /* ========================================== */
        /* --- EASY LOGO SIZE ADJUSTMENTS (FOOTER)--- */
        /* ========================================== */
        
        #footer-1390 .cs-footer-logo img {
            height: 90px; /* Desktop Footer Logo Size */
            width: auto;
            transition: height 0.3s;
        }

        @media only screen and (max-width: 63.9375rem) {
            #footer-1390 .cs-footer-logo img {
                height: 70px; /* Mobile Footer Logo Size */
            }
        }
    </style>

    <div class="cs-container">
        <div class="cs-top">
            <a aria-label="go back to home" class="cs-logo cs-footer-logo" href="/">
                <img src="/assets/images/SMC2.png" alt="SMC Gloves Logo">
            </a>
            <ul class="cs-ul">
                {% set navPages = collections.all | eleventyNavigation %}
                {% for entry in navPages %}
                    <li class="cs-li">
                        <a href="{{ entry.link }}" class="cs-link">{{ entry.key }}</a>
                    </li>
                {% endfor %}
            </ul>
        </div>
        <div class="cs-bottom">
            <!--Social-->
            <ul class="cs-social">
                <li class="cs-social-li">
                    <a href="#" class="cs-social-link" aria-label="instagram" target="_blank" rel="noopener">
                        <img class="cs-social-icon cs-default" src="https://csimg.nyc3.cdn.digitaloceanspaces.com/Icons/instagram-ba.svg" alt="icon" loading="lazy" decoding="async" width="12" height="12" aria-hidden="true">
                    </a>
                </li>
            </ul>
            <span class="cs-copyright">
                © Copyright 2026 - Shamrock Manufacturing | 5445 Daniels Street, Chino, CA 91710 | 909-591-8855
            </span>
            <div class="cs-flex">
                <a href="/privacy" class="cs-copyright-link">Privacy Policy</a>
                <span class="cs-separater">|</span>
                <a href="/terms" class="cs-copyright-link">Terms of Use</a>
            </div>
        </div>
    </div>
</section>
